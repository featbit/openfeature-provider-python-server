[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "featbit-openfeature-server"
version = "0.1.0"
description = "OpenFeature provider for the FeatBit Python server SDK"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
authors = [{name = "FeatBit"}]
dependencies = [
    "openfeature-sdk>=0.10,<1",
    "fb-python-sdk>=1.1.8,<2",
]

[project.optional-dependencies]
dev = [
    "build>=1,<2",
    "flake8>=7,<8",
    "pytest>=8,<10",
]

[project.urls]
Homepage = "https://github.com/featbit/openfeature-provider-python-server"
Issues = "https://github.com/featbit/openfeature-provider-python-server/issues"

[tool.setuptools.packages.find]
include = ["featbit_openfeature*"]

[tool.setuptools.package-data]
featbit_openfeature = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
